# Placeholder secret. In a real cluster generate this out-of-band and never
# commit real credentials, e.g.:
#   kubectl create secret generic api-secrets -n staterpack \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=RABBITMQ_URL=amqp://user:pass@host:5672/ \
#     --from-literal=LLM_API_KEY=sk-...
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: staterpack
type: Opaque
stringData:
  POSTGRES_USER: "app"
  POSTGRES_PASSWORD: "change-me"
  REDIS_PASSWORD: ""
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.staterpack.svc.cluster.local:5672/"
  LLM_API_KEY: "sk-change-me"
