# Schema migration Job. Run it before rolling out a new image:
#   kubectl apply -f deploy/k8s/20-migrate-job.yaml
#   kubectl wait --for=condition=complete job/api-migrate -n staterpack --timeout=120s
# The Deployment sets DB_AUTO_MIGRATE=false so replicas never race each other
# applying DDL.
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  namespace: staterpack
  labels:
    app.kubernetes.io/name: golang-staterpack
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          image: ghcr.io/example/golang-staterpack:latest
          # Same binary; the migration path runs when MIGRATE_ONLY is set.
          args: ["--migrate-only"]
          env:
            - name: MIGRATE_ONLY
              value: "true"
            - name: DB_AUTO_MIGRATE
              value: "true"
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
